<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ce l'ho fatta</title>
<meta name="description" content="Un piccolo easter egg per festeggiare la fine della tesi.">
<meta name="theme-color" content="#ffd9b8">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><rect width=%2232%22 height=%2232%22 rx=%227%22 fill=%22%23ffd43b%22/><circle cx=%2216%22 cy=%2216%22 r=%229%22 fill=%22%23fff8e1%22 stroke=%22%232b2622%22 stroke-width=%222.5%22/></svg>">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<style>
:root {
  --sun: #ffd43b;
  --cream: #fff8e1;
  --ink: #2b2622;
  --focus: 0;
}

* {
  box-sizing: border-box;
}

[hidden] {
  display: none !important;
}

html {
  overflow-anchor: none;
}

body {
  margin: 0;
  background: #ffd9b8;
  color: var(--ink);
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

button {
  font: inherit;
  color: inherit;
}

:focus-visible {
  outline: 3px solid var(--ink);
  outline-offset: 4px;
  border-radius: 10px;
}

/* La pagina è solo una pista per lo scroll: tutto accade nel canvas fisso. */
#runway {
  height: 100lvh;
}

#stage {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  opacity: 0;
  transition: opacity 0.9s ease;
}

.is-ready #stage {
  opacity: 1;
}

.has-focus #stage {
  cursor: zoom-in;
}

/* Quando una foto è a fuoco il mondo arretra. */
.veil {
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: calc(var(--focus) * 0.62);
  background: radial-gradient(ellipse at center, rgba(16, 12, 10, 0) 34%, rgba(16, 12, 10, 0.86) 100%);
}

/* Il pulsante è invisibile: quello che si vede è il pulmino 3D sotto. */
.start {
  position: fixed;
  left: 50%;
  top: 50%;
  width: min(88vw, 620px);
  height: min(46vh, 340px);
  transform: translate(-50%, -38%);
  border: 0;
  background: none;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

/* Nessun testo: una freccia che respira dice "scorri". */
.hint {
  position: fixed;
  left: 50%;
  bottom: calc(26px + env(safe-area-inset-bottom));
  width: 34px;
  margin-left: -17px;
  color: var(--cream);
  filter: drop-shadow(0 2px 3px rgba(43, 38, 34, 0.45));
  transition: opacity 0.4s ease;
  animation: breathe 1.8s ease-in-out infinite;
  pointer-events: none;
}

.has-left .hint {
  opacity: 0;
}

@keyframes breathe {
  50% {
    transform: translateY(7px);
  }
}

/* La strada del viaggio: un filo in basso, con il pulmino che avanza. */
.hud {
  position: fixed;
  left: 22px;
  right: 88px;
  bottom: calc(26px + env(safe-area-inset-bottom));
  height: 4px;
  border-radius: 2px;
  background: rgba(255, 248, 225, 0.32);
  container-type: inline-size;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.5s ease;
}

.has-left .hud {
  opacity: 1;
}

.hud::before {
  content: "";
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: calc(var(--progress, 0) * 100%);
  border-radius: 2px;
  background: var(--cream);
}

.hud__bus {
  position: absolute;
  left: 0;
  bottom: -2px;
  width: 26px;
  height: 14px;
  border-radius: 4px 5px 3px 3px;
  border: 2px solid var(--ink);
  background: linear-gradient(var(--cream) 50%, var(--sun) 50%);
}

/* Il player esiste ma non si vede: la pagina non ha testo, e Spotify ne
   mostra. Resta nel viewport, altrimenti non si caricherebbe. */
.player {
  position: fixed;
  left: 0;
  bottom: 0;
  width: 300px;
  height: 152px;
  opacity: 0;
  pointer-events: none;
  z-index: -1;
}

.sound {
  position: fixed;
  right: 18px;
  bottom: calc(14px + env(safe-area-inset-bottom));
  z-index: 50;
  display: grid;
  place-items: center;
  width: 54px;
  height: 54px;
  border-radius: 50%;
  border: 3px solid var(--ink);
  background: var(--cream);
  color: var(--ink);
  box-shadow: 0 10px 18px -10px rgba(43, 38, 34, 0.6);
  cursor: pointer;
  transition: transform 0.15s ease;
}

.sound:active {
  transform: scale(0.94);
}

.sound .sound__play {
  display: none;
}

.sound.is-paused .sound__play {
  display: block;
}

.sound.is-paused .sound__pause {
  display: none;
}

.lightbox {
  position: fixed;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 26px;
  background: rgba(20, 16, 14, 0.95);
  z-index: 100;
}

.lightbox.is-open {
  display: flex;
  animation: appear 0.3s ease both;
}

@keyframes appear {
  from {
    opacity: 0;
  }
}

.lightbox__img {
  display: block;
  max-width: 100%;
  max-height: 86vh;
  border: 10px solid var(--cream);
  border-bottom-width: 34px;
  border-radius: 4px;
}

.lightbox__close {
  position: absolute;
  top: 18px;
  right: 18px;
  display: grid;
  place-items: center;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: 3px solid var(--ink);
  background: var(--sun);
  color: var(--ink);
  cursor: pointer;
}

.has-arrived .hud {
  opacity: 0;
}

/* La cabina oltre il traguardo. */
.round {
  display: grid;
  place-items: center;
  border-radius: 50%;
  border: 3px solid var(--ink);
  background: var(--cream);
  color: var(--ink);
  box-shadow: 0 10px 18px -10px rgba(43, 38, 34, 0.6);
  cursor: pointer;
  transition: transform 0.15s ease;
  touch-action: manipulation;
}

.round:active {
  transform: scale(0.94);
}

.camera {
  position: fixed;
  left: 50%;
  bottom: calc(22px + env(safe-area-inset-bottom));
  width: 84px;
  height: 84px;
  margin-left: -42px;
  background: var(--sun);
  z-index: 40;
  animation: invite 1.8s ease-in-out infinite;
}

@keyframes invite {
  50% {
    box-shadow: 0 0 0 16px rgba(255, 248, 225, 0.45);
  }
}

.after {
  position: fixed;
  left: 50%;
  bottom: calc(22px + env(safe-area-inset-bottom));
  display: flex;
  gap: 16px;
  transform: translateX(-50%);
  z-index: 40;
}

.share {
  position: fixed;
  left: 50%;
  bottom: calc(100px + env(safe-area-inset-bottom));
  display: grid;
  justify-items: center;
  gap: 6px;
  width: min(86vw, 320px);
  transform: translateX(-50%);
  text-align: center;
  z-index: 40;
}

/* Qui il testo c'è: mostrare un volto agli altri è una scelta, e va capita. */
.share__button {
  width: 100%;
  padding: 13px 18px;
  border: 3px solid var(--ink);
  border-radius: 14px;
  background: #e4572e;
  color: var(--cream);
  font: 700 17px/1.2 system-ui, sans-serif;
  cursor: pointer;
  box-shadow: 0 10px 18px -10px rgba(43, 38, 34, 0.6);
}

.share__button:disabled {
  opacity: 0.6;
}

.share__button.is-wrong {
  animation: wrong 0.4s ease;
}

@keyframes wrong {
  25% {
    transform: translateX(-8px);
  }
  75% {
    transform: translateX(8px);
  }
}

.share__remove {
  background: var(--cream);
  color: var(--ink);
}

.share__note {
  margin: 0;
  padding: 3px 8px;
  border-radius: 6px;
  background: rgba(255, 248, 225, 0.86);
  color: var(--ink);
  font: 500 13px/1.3 system-ui, sans-serif;
}

.after .round {
  width: 64px;
  height: 64px;
}

.booth {
  position: fixed;
  inset: 0;
  display: grid;
  grid-template-rows: minmax(0, 1fr) auto;
  justify-items: center;
  align-items: center;
  gap: 16px;
  padding: 22px 18px calc(22px + env(safe-area-inset-bottom));
  background: rgba(20, 16, 14, 0.94);
  z-index: 90;
}

.booth__print {
  position: relative;
  aspect-ratio: 4 / 5;
  width: min(100%, 56dvh);
  padding: 10px 10px 40px;
  border-radius: 5px;
  background: var(--cream);
}

.booth__video {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transform: scaleX(-1);
  background: var(--ink);
}

.booth__count {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 13px;
  display: flex;
  justify-content: center;
  gap: 8px;
}

.booth__count i {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  border: 3px solid var(--ink);
}

.booth__count[data-count="3"] i,
.booth__count[data-count="2"] i:nth-child(n + 2),
.booth__count[data-count="1"] i:nth-child(3) {
  background: #e4572e;
}

.booth__shutter {
  width: 78px;
  height: 78px;
  background: #e4572e;
  box-shadow: 0 0 0 5px var(--cream);
}

.booth__close {
  position: absolute;
  top: 18px;
  right: 18px;
  width: 44px;
  height: 44px;
  background: var(--sun);
}

.flash {
  position: fixed;
  inset: 0;
  background: #fff;
  opacity: 0;
  pointer-events: none;
  z-index: 95;
}

.flash.is-on {
  animation: flash 0.75s ease-out;
}

@keyframes flash {
  0% {
    opacity: 1;
  }
}

/* Versione semplice: stesse foto e stessa musica, senza 3D. */
.is-simple body {
  background: var(--sun);
}

.is-simple #stage,
.is-simple .veil,
.is-simple .hint,
.is-simple .hud {
  display: none;
}

.is-simple #runway {
  height: auto;
}

.is-simple .start {
  position: static;
  display: block;
  width: 100%;
  height: 40vh;
  transform: none;
}

.simple {
  display: grid;
  gap: 60px;
  padding: 40px 18px 120px;
}

.simple__chapter {
  display: grid;
  gap: 26px;
  justify-items: center;
}

.simple__print {
  padding: 9px 9px 32px;
  border: 3px solid var(--ink);
  border-radius: 4px;
  background: var(--cream);
  cursor: zoom-in;
}

.simple__print img {
  display: block;
  max-width: 100%;
  max-height: 80vh;
  height: auto;
}
</style>
</head>
<body>

<canvas id="stage" aria-hidden="true"></canvas>
<div class="veil" aria-hidden="true"></div>

<main id="runway">
  <button class="start" id="start" type="button" aria-label="Play: fa partire la musica"></button>
  <div class="simple" id="simple" aria-label="Le foto" hidden></div>
</main>

<svg class="hint" id="hint" viewBox="0 0 34 24" aria-hidden="true" hidden>
  <path d="M4 5l13 13L30 5" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

<div class="hud" id="hud" aria-hidden="true" hidden>
  <div class="hud__bus" id="hudBus"></div>
</div>

<div class="player" aria-hidden="true"><div id="spotify"></div></div>

<button class="sound is-paused" id="sound" type="button" aria-label="Fai ripartire la musica" hidden>
  <svg class="sound__pause" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.5" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1.5" fill="currentColor"/></svg>
  <svg class="sound__play" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/></svg>
</button>

<button class="round camera" id="cameraButton" type="button" aria-label="Scatta una foto al traguardo" hidden>
  <svg viewBox="0 0 32 32" width="38" height="38" aria-hidden="true"><path d="M5 10h5.5l2-3.5h7l2 3.5H27a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V12a2 2 0 0 1 2-2z" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"/><circle cx="16" cy="18" r="5.2" fill="none" stroke="currentColor" stroke-width="2.6"/></svg>
</button>

<div class="after" id="after" hidden>
  <button class="round" id="afterSave" type="button" aria-label="Salva la tua foto">
    <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10.5l5 5 5-5M5 20h14"/></svg>
  </button>
  <button class="round" id="afterRetake" type="button" aria-label="Rifai la foto">
    <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12a7 7 0 1 0 2.2-5.1M5 4v4.5h4.5"/></svg>
  </button>
</div>

<div class="share" id="share" hidden>
  <button class="share__button" id="shareButton" type="button" hidden>Mostra a tutti</button>
  <button class="share__button share__remove" id="unshareButton" type="button" hidden>Togli la mia foto</button>
  <p class="share__note">La vedrà chi scansiona il QR della tesi.</p>
</div>

<div class="booth" id="booth" role="dialog" aria-modal="true" aria-label="Fotocamera" hidden>
  <div class="booth__print">
    <video class="booth__video" id="boothVideo" playsinline muted autoplay></video>
    <div class="booth__count" id="boothCount" aria-hidden="true"><i></i><i></i><i></i></div>
  </div>
  <button class="round booth__shutter" id="boothShutter" type="button" aria-label="Scatta"></button>
  <button class="round booth__close" id="boothClose" type="button" aria-label="Chiudi la fotocamera">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
</div>
<input id="boothFile" type="file" accept="image/*" capture="user" hidden>
<div class="flash" id="flash" aria-hidden="true"></div>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Foto ingrandita" aria-hidden="true">
  <button class="lightbox__close" id="lightboxClose" aria-label="Chiudi la foto">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
      <path d="M6 6l12 12M18 6L6 18"/>
    </svg>
  </button>
  <img class="lightbox__img" id="lightboxImg" alt="">
</div>

<!-- Condiviso con build.js, che cifra le foto: tenerlo in un file solo evita
     che la pagina e il build usino due versioni diverse della cifratura. -->
<script src="laurea-crypto.js"></script>
<script type="module" src="main.js"></script>
</body>
</html>
