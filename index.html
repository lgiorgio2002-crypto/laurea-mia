<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ce l'ho fatta</title>
<meta name="description" content="Un piccolo easter egg per festeggiare la fine della tesi.">
<meta name="theme-color" content="#ffd43b">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><rect width=%2232%22 height=%2232%22 rx=%227%22 fill=%22%23ffd43b%22/><circle cx=%2216%22 cy=%2216%22 r=%229%22 fill=%22%23fff8e1%22 stroke=%22%232b2622%22 stroke-width=%222.5%22/></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>

<main>

  <section class="scene" id="scene">
    <div class="sun" aria-hidden="true"></div>

    <div class="lane">
      <button class="bus" id="bus" type="button" aria-label="Play: fa partire la canzone">
        <svg class="bus__art" viewBox="0 0 420 240" aria-hidden="true">
          <defs>
            <clipPath id="busShape">
              <rect x="28" y="28" width="364" height="162" rx="34"/>
            </clipPath>
          </defs>
          <ellipse class="bus__shadow" cx="210" cy="224" rx="176" ry="10"/>
          <g class="bus__body">
            <rect x="28" y="28" width="364" height="162" rx="34" fill="#fff8e1"/>
            <g clip-path="url(#busShape)">
              <rect x="20" y="108" width="380" height="90" fill="#f7c51e"/>
              <path d="M28 108H392" stroke="#2b2622" stroke-width="4"/>
              <path d="M248 108V190M314 108V190" stroke="#2b2622" stroke-width="3" opacity=".55"/>
            </g>
            <g fill="#bfe3f2" stroke="#2b2622" stroke-width="4">
              <rect x="56" y="46" width="54" height="50" rx="10"/>
              <rect x="122" y="46" width="54" height="50" rx="10"/>
              <rect x="188" y="46" width="54" height="50" rx="10"/>
              <rect x="254" y="46" width="54" height="50" rx="10"/>
              <rect x="320" y="46" width="54" height="50" rx="10"/>
            </g>
            <g stroke="#fff8e1" stroke-width="4" stroke-linecap="round" opacity=".85">
              <path d="M68 84l14-26M134 84l14-26M200 84l14-26M266 84l14-26M332 84l14-26"/>
            </g>
            <rect x="256" y="122" width="16" height="6" rx="3" fill="#2b2622"/>
            <rect x="31" y="124" width="9" height="22" rx="3" fill="#e4572e"/>
            <circle cx="384" cy="148" r="9" fill="#fff6c2" stroke="#2b2622" stroke-width="3"/>
            <rect x="28" y="28" width="364" height="162" rx="34" fill="none" stroke="#2b2622" stroke-width="5"/>
            <g class="bus__badge">
              <circle cx="150" cy="150" r="23" fill="#fff8e1" stroke="#2b2622" stroke-width="4"/>
              <path d="M143 138v24l20-12z" fill="#2b2622"/>
            </g>
            <rect x="12" y="180" width="38" height="11" rx="4" fill="#fff8e1" stroke="#2b2622" stroke-width="3"/>
            <rect x="370" y="180" width="38" height="11" rx="4" fill="#fff8e1" stroke="#2b2622" stroke-width="3"/>
          </g>
          <circle cx="102" cy="194" r="34" fill="#2b2622"/>
          <circle cx="318" cy="194" r="34" fill="#2b2622"/>
          <g class="wheel">
            <circle cx="102" cy="194" r="27" fill="#3a342f"/>
            <circle cx="102" cy="194" r="13" fill="#d9d2c3"/>
            <rect x="99" y="181" width="6" height="9" rx="2" fill="#2b2622"/>
            <circle cx="102" cy="194" r="4" fill="#2b2622"/>
          </g>
          <g class="wheel">
            <circle cx="318" cy="194" r="27" fill="#3a342f"/>
            <circle cx="318" cy="194" r="13" fill="#d9d2c3"/>
            <rect x="315" y="181" width="6" height="9" rx="2" fill="#2b2622"/>
            <circle cx="318" cy="194" r="4" fill="#2b2622"/>
          </g>
        </svg>
      </button>
    </div>

    <div class="road" aria-hidden="true"></div>
  </section>

  <section class="trip" id="foto" aria-label="Le foto" hidden>
    <div class="strip" id="strip" tabindex="0" role="region" aria-label="Galleria di foto, scorrevole orizzontalmente"></div>
    <div class="route" id="route" aria-hidden="true">
      <div class="route__road"></div>
      <div class="route__bus" id="miniBus"></div>
      <svg class="route__flag" viewBox="0 0 40 56">
        <path d="M6 54V4" stroke="#2b2622" stroke-width="4" stroke-linecap="round"/>
        <path d="M8 6h28v22H8z" fill="#fff8e1" stroke="#2b2622" stroke-width="3" stroke-linejoin="round"/>
        <path d="M8 6h7v7.3H8zM22 6h7v7.3h-7zM15 13.3h7v7.4h-7zM29 13.3h7v7.4h-7zM8 20.7h7V28H8zM22 20.7h7V28h-7z" fill="#2b2622"/>
      </svg>
    </div>
  </section>

  <div class="player" aria-hidden="true">
    <iframe data-testid="embed-iframe" style="border-radius:12px" src="https://open.spotify.com/embed/track/7wFEzF8FbofVlQS1OcbghM?utm_source=generator&si=dde2afc9e45c4278" width="100%" height="352" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy" tabindex="-1"></iframe>
  </div>

</main>

<button class="sound" id="sound" type="button" aria-label="Metti in pausa la canzone" hidden>
  <svg class="sound__pause" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.5" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1.5" fill="currentColor"/></svg>
  <svg class="sound__play" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/></svg>
</button>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Foto ingrandita" aria-hidden="true">
  <button class="lightbox__close" id="lightboxClose" aria-label="Chiudi la foto">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
      <path d="M6 6l12 12M18 6L6 18"/>
    </svg>
  </button>
  <img class="lightbox__img" id="lightboxImg" alt="">
</div>

<script src="laurea-crypto.js"></script>
<script type="module" src="script.js"></script>
</body>
</html>
